name: Sync GRID Directory

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: Who requested this sync
        required: false
        type: string
        default: admin
      request_id:
        description: Sync history request id
        required: false
        type: string
        default: ""

concurrency:
  group: grid-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run GRID website refresh
        env:
          GRID_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GRID_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRID_LOCAL_IMPORT_TOKEN: ${{ secrets.GRID_LOCAL_IMPORT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GRID_ENABLE_AI_ENRICHMENT: 1
          GRID_IMPORT_CHUNK_SIZE: 20
          GRID_REQUESTED_BY: ${{ inputs.requested_by || 'admin' }}
          GRID_SYNC_REQUEST_ID: ${{ inputs.request_id || '' }}
        run: node scripts/grid-local-import.mjs
