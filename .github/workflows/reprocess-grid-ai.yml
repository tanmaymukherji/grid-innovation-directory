name: Reprocess GRID AI

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: Who requested this AI reprocess
        required: false
        type: string
        default: admin

concurrency:
  group: grid-ai-reprocess
  cancel-in-progress: false

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reprocess GRID AI classification
        env:
          GRID_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GRID_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GRID_REPROCESS_LIMIT: 300
          GRID_REQUESTED_BY: ${{ inputs.requested_by || 'admin' }}
        run: node scripts/grid-ai-reprocess.mjs
